name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-release-bundle:
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build release bundle (host + UI)
        run: bash scripts/prepare-release-bundle.sh

      - name: Packaged release smoke
        run: node scripts/packaged-release-bundle-smoke.mjs

      - name: Upload release archive
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          body: |
            Collector host + browser UI (no Tauri).

            **Install**
            1. Download the `.tar.gz` for your platform.
            2. Unpack.
            3. Run `./collector --data-dir /path/to/vault-data` (or set `COLLECTOR_DATA_DIR`).
            4. Open the `baseUrl` printed in `COLLECTOR_SERVICE_READY` (UI is served by the host).

            **Update**
            Download a newer archive from GitHub Releases, stop the host, replace files, start again.
            There is no in-app auto-updater.

            **MCP / CLI**
            Use `collector-service-host/collector-mcp` and `collector-cli` against the living host
            (same data-dir / token as documented in README).
          files: |
            dist/collector-*.tar.gz
            dist/collector-*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
